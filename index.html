<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de endereços</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Cadastro Aluno</h1>

  <form id="formEndereco">
    <fieldset>
      <legend>Novo Cadastro</legend>

      <div class="linha">
        <label>
          <span>Nome</span>
          <input name="Nome" required placeholder="Wagner">
        </label>
        <label style="flex: 3 1 300px;">
          <span>CPF</span>
          <input name="CPF" required placeholder="000.000.000-00"
          maxlength="14"
          oninput="aplicarMascaraCPF(this)">
        </label>
        <label style="flex: 0 1 100px;">
          <span>@gmail</span>
          <input name="@gmail" required placeholder="exemplo@gmai.com">
        </label>
      </div>

      <div class="linha">
        <label>
          <span>Cidade</span>
          <input name="Cidade" required placeholder="Foz do Iguaçu">
        </label>
        <label>
          <span>Telefone</span>
          <input name="Telefone" required 
           placeholder="(00) 00000-0000"
           maxlength="15"
           oninput="aplicarMascaraTelefone(this)">
        </label>
      </div>

      <div class="linha">
        <label style="flex: 3 1 240px;">
          <span>CEP</span>
          <input name="CEP" required  placeholder="00000-000"
           maxlength="9"
           oninput="aplicarMascaraCEP(this)">
        </label>
        <label style="flex: 0 1 80px;">
          <span>ID</span>
          <input name="ID" maxlength="3" placeholder="000">
        </label>
      </div>

      <button type="submit">Cadastrar Aluno</button>
      <p id="aviso"></p>
    </fieldset>
  </form>

  <h2>Aluno Cadastrado</h2>
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>CPF</th>
        <th>@gmail</th>
        <th>Cidade</th>
        <th>Telefone</th>
        <th>CEP</th>
        <th>ID</th>
      </tr>
    </thead>
    <tbody id="corpoTabela"></tbody>
  </table>

  <script src="script.js">
    
  </script>

</body>
</html>
